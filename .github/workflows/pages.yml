name: Pages

# Publishes the page, and once a week re-reads the agenda into the snapshot
# the page starts from. If the agenda is unreachable the snapshot already in
# the repository is published as it is.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - name: Refresh the snapshot
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          AGENDA_KEY: ${{ secrets.AGENDA_KEY }}
        run: |
          node scripts/snapshot.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot/events.bin
          git diff --cached --quiet || git commit -m "Refresh the agenda snapshot"
          git push
      - run: node scripts/build-site.mjs
        env:
          AGENDA_KEY: ${{ secrets.AGENDA_KEY }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

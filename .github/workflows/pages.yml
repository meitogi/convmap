name: Pages

# Publishes the page, and once a week re-reads the agenda into the snapshot
# the page starts from. If the agenda is unreachable the snapshot already in
# the repository is published as it is.
#
# Two jobs, as the deploy action recommends : `build` uploads the site,
# `deploy` publishes it once that upload is complete. In one job, the deploy
# step could look for the upload before GitHub listed it, and fail with
# "No artifacts named github-pages were found".

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # To commit the refreshed snapshot.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - name: Refresh the snapshot
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          AGENDA_KEY: ${{ secrets.AGENDA_KEY }}
        run: |
          node scripts/update.mjs --ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot/events.bin
          git diff --cached --quiet || git commit -m "Refresh the agenda snapshot"
          git push
      - run: node scripts/build-site.mjs
        env:
          AGENDA_KEY: ${{ secrets.AGENDA_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conv'Map — conventions par zone</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14161a">
<script>
  // Before the first paint : the saved theme, else the system's.
  try { document.documentElement.dataset.theme = localStorage.getItem('agenda-geek-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch { document.documentElement.dataset.theme = 'light'; }
</script>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <h1><img class="logo" src="favicon.svg" alt="" width="26" height="26">Conv'Map <span>conventions par zone</span></h1>
  <span id="fetched" class="muted"></span>
  <button id="refetch" type="button">Mettre à jour<span class="long"> depuis l'agenda</span></button>
  <button id="add" type="button">+ Ajouter<span class="long"> un évènement</span></button>
  <button id="theme" type="button" class="icon-button"></button>
</header>

<main>
  <section class="panel">
    <div class="panel-head">
    <button id="filters-toggle" type="button" aria-expanded="false"></button>
    <div id="filters-box">
    <div class="searches">
      <select id="searches" aria-label="Recherches enregistrées"></select>
      <input id="search-name" placeholder="Nom de la recherche" aria-label="Nom de la recherche">
      <button id="search-save" type="button">Enregistrer la recherche</button>
      <button id="search-delete" type="button">Supprimer</button>
    </div>
    <form id="filters" class="filters">
      <label class="wide">Lieu
        <span class="inline">
          <input id="place" list="cities" placeholder="Ville" autocomplete="off">
          <button id="pick-place" type="button" aria-pressed="false" title="Choisir le lieu en cliquant sur la carte">Sur la carte</button>
          <button id="clear-place" type="button">Effacer</button>
        </span>
      </label>
      <div class="field">Rayon
        <input id="radius" type="range" min="10" max="300" step="10" aria-label="Rayon">
        <span class="km"><input id="radius-km" type="number" min="1" max="1000" step="1" aria-label="Rayon en kilomètres"> km</span>
      </div>
      <label>Période
        <select id="period">
          <option value="all">Tout (passé et à venir)</option>
          <option value="upcoming">À venir : annoncé ou probable</option>
          <option value="announced">À venir : date annoncée</option>
          <option value="past">Rien d'à venir</option>
        </select>
      </label>
      <label>À partir de
        <input id="from" type="month">
      </label>
      <label>Tag
        <select id="tag">
          <option value="">Tous</option>
          <option value="regular">régulier</option>
          <option value="new">nouveau</option>
          <option value="paused">en pause ?</option>
          <option value="oneoff">ponctuel</option>
        </select>
      </label>
      <label>Catégorie
        <select id="category"><option value="">Toutes</option></select>
      </label>
      <div class="field">Régions / pays
        <details class="multi" id="regions"><summary></summary><div class="options"></div></details>
      </div>
      <div class="field">Départements
        <details class="multi" id="departments"><summary></summary><div class="options"></div></details>
      </div>
      <label class="wide">Recherche
        <input id="search" type="search" placeholder="Nom, ville, organisateur">
      </label>
      <datalist id="cities"></datalist>
    </form>
    </div>
    <p id="status" class="status" hidden></p>
    <nav class="views" aria-label="Affichage">
      <button type="button" data-view="list" aria-pressed="true">Liste</button>
      <button type="button" data-view="map" aria-pressed="false">Carte</button>
    </nav>
    </div>
    <div class="panel-list">

    <div class="bar">
      <strong id="count"></strong>
      <select id="sort" aria-label="Trier par">
        <option value="date">Trier par date</option>
        <option value="distance">Trier par proximité</option>
      </select>
      <button id="check-all" type="button">Tout cocher</button>
      <button id="check-none" type="button">Tout décocher</button>
      <button id="export" type="button" class="primary">Exporter…</button>
    </div>

    <div id="list"></div>
    <details id="unlocated" hidden>
      <summary></summary>
      <div id="unlocated-list"></div>
    </details>
    <footer class="credits">Conv'Map — développé par <a href="https://github.com/meitogi" target="_blank" rel="noopener">meitogi</a> · données : <a href="https://lagendageek.com" target="_blank" rel="noopener">L'Agenda Geek</a> · carte © les contributeurs d'<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></footer>
    </div>
  </section>
  <div id="map"></div>
  <aside id="map-card" hidden></aside>
</main>

<dialog id="export-dialog">
  <form method="dialog">
    <h2>Exporter <span id="export-count" class="muted"></span></h2>
    <div class="formats">
      <label><input type="radio" name="format" value="text" checked> Texte SMS / mail</label>
      <label><input type="radio" name="format" value="tsv"> Texte pour tableur</label>
      <label><input type="radio" name="format" value="md"> Markdown</label>
      <label><input type="radio" name="format" value="csv"> CSV</label>
    </div>
    <label class="check"><input id="export-contacts" type="checkbox"> Inclure les contacts organisateurs</label>
    <p id="export-hint" class="muted"></p>
    <textarea id="export-text" readonly rows="18" wrap="off"></textarea>
    <div class="actions">
      <button id="export-copy" type="button" class="primary">Copier</button>
      <button id="export-download" type="button">Télécharger le fichier</button>
      <button value="close">Fermer</button>
    </div>
  </form>
</dialog>

<dialog id="edit-dialog">
  <form id="edit-form">
    <h2 id="edit-title"></h2>
    <p id="edit-hint" class="muted"></p>
    <div class="grid">
      <label class="wide">Titre <input name="title" required></label>
      <label>Début <input name="start_date" type="date" required></label>
      <label>Fin <input name="end_date" type="date"></label>
      <label>Lieu <input name="venue"></label>
      <label>Ville <input name="city" list="cities" autocomplete="off"></label>
      <label>Code postal <input name="zip"></label>
      <label>Pays <input name="country"></label>
      <label>Catégorie <input name="category"></label>
      <label>Latitude <input name="lat" inputmode="decimal"></label>
      <label>Longitude <input name="lng" inputmode="decimal"></label>
      <label class="wide">Site <input name="website" type="url"></label>
      <label>Organisateur <input name="organizer"></label>
      <label>Email <input name="email" type="email"></label>
      <label>Téléphone <input name="phone"></label>
      <label>Facebook <input name="facebook" type="url"></label>
      <label>Instagram <input name="instagram" type="url"></label>
      <label class="wide">Note <textarea name="note" rows="2"></textarea></label>
    </div>
    <p id="edit-error" class="error" hidden></p>
    <div class="actions">
      <button id="edit-delete" type="button" class="danger">Supprimer</button>
      <button type="submit" class="primary">Enregistrer</button>
      <button id="edit-cancel" type="button">Annuler</button>
    </div>
  </form>
</dialog>

<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>

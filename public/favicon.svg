<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="Conv'Map">
  <!-- A torii gate drawn in pixels, a gamepad's four buttons under it :
       Japan and video games, the two halves of a geek convention. Drawn on
       a 16 x 16 grid so that it stays sharp at favicon size. -->
  <rect width="16" height="16" rx="3" fill="#14161a" shape-rendering="auto"/>
  <rect x="1" y="2" width="14" height="1" fill="#e5484d"/><rect x="2" y="3" width="12" height="1" fill="#e5484d"/><rect x="3" y="4" width="10" height="1" fill="#e5484d"/><rect x="3" y="6" width="10" height="1" fill="#e5484d"/><rect x="4" y="5" width="2" height="9" fill="#e5484d"/><rect x="10" y="5" width="2" height="9" fill="#e5484d"/><rect x="7" y="8" width="2" height="2" fill="#f2c94c"/><rect x="7" y="12" width="2" height="2" fill="#3fb27a"/><rect x="5" y="10" width="2" height="2" fill="#6ea0ff"/><rect x="9" y="10" width="2" height="2" fill="#b08ae6"/>
</svg>
